name: Package

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.0.1
      - name: Build
        run: uv build
      - name: Smoke test
        run: |
          uv venv
          source .venv/bin/activate
          uv pip install dist/*.whl
          pnextract -h
      - name: Publish to PyPI
        if: github.event_name == 'release'
        run: uv publish
      - name: Upload binaries to GitHub Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          unzip -p dist/*.whl pnextract/pnextract > pnextract
          unzip -p dist/*.whl pnextract/voxelImageProcess > voxelImageProcess
          chmod +x pnextract voxelImageProcess
          gh release upload "${{ github.event.release.tag_name }}" \
            pnextract \
            voxelImageProcess
