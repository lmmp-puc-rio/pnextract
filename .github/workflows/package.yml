name: Package

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.0.1
      - name: Build
        run: uv build --sdist
      - name: Publish to PyPI
        if: github.event_name == 'release'
        run: uv publish

  wheel:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.0.1
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: UCRT64
          update: true
          path-type: inherit
          install: >-
            make
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-libgomp
      - name: Build
        run: uv build --wheel
      - name: Smoke test
        run: uv run --no-project --with ./dist/*.whl pnextract -h
      - name: Extract standalone binaries
        run: uv run --no-project python -m zipfile -e ./dist/*.whl standalone
      - uses: actions/upload-artifact@v7
        with:
          name: pnextract-${{ runner.os }}
          path: |
            dist/*
            standalone/pnextract/pnextract*
            standalone/pnextract/voxelImageProcess*
      - name: Publish to PyPI
        if: github.event_name == 'release'
        run: uv publish
      - name: Upload binaries to GitHub Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            standalone/pnextract/pnextract* \
            standalone/pnextract/voxelImageProcess*
